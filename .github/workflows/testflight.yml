name: Publish TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional TestFlight release notes
        required: false
        type: string
  workflow_call:
    inputs:
      release_notes:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-publish
  cancel-in-progress: false

jobs:
  # The app's unit and UI tests gate the upload: a build that fails them never
  # reaches TestFlight, the Monday freshness republish included.
  app-tests:
    uses: ./.github/workflows/app-tests.yml

  publish:
    name: Build and upload
    needs: app-tests
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: net.steinbok.Rulebook
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # The Xcode project is generated, not committed: App/project.yml is the
      # source of truth, so it cannot drift from what is built here.
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Library tests
        run: swift test

      # YYYYMMDDHHmm, matching Scripts/testflight.sh. Build numbers must
      # strictly increase and can never be lowered, so every source of builds
      # has to share one scheme: a run counter works on a runner but a laptop
      # cannot know GITHUB_RUN_NUMBER, and one local upload would then put the
      # number permanently out of reach of the workflow.
      - name: Set unique build number
        id: build
        run: |
          build_number="$(date -u +%Y%m%d.%H%M)"
          echo "number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Archive app
        run: |
          xcodebuild archive \
            -project App/Rulebook.xcodeproj \
            -scheme Rulebook \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Rulebook.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.number }}" \
            DEVELOPMENT_TEAM=Y7KVX7666P \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Rulebook App Store"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rulebook.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" \
            -exportOptionsPlist .github/testflight-export-options.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/TestFlight/Rulebook.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes || format('Automated build {0}', steps.build.outputs.number) }}
          wait-for-processing: "true"
