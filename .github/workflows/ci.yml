name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The app's tests on demand, e.g. on a branch before opening a PR.
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same pull request is wasted macOS minutes.
# Pushes to main keep their runs, so every commit on main has a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required check on pull requests: fast, a few minutes. The library
  # suite includes GraphConformanceTests, so FakeGraph is checked against the
  # recorded Graph traffic on every PR.
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The hermetic suite only. RulebookLiveTests gates itself on
      # RULEBOOK_LIVE, which is unset here, so its suites report as skipped
      # rather than reaching for a real mailbox.
      - name: Test RulebookKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      # App/project.yml is the source of truth, so the project is regenerated
      # before xcodebuild sees it.
      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      # A generic simulator destination and no signing: this proves the app
      # compiles. Signing belongs to the TestFlight workflow, which is the
      # only place the certificates exist.
      - name: Build app
        run: |
          xcodebuild build \
            -project App/Rulebook.xcodeproj \
            -scheme Rulebook \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  # The app's unit and UI tests. Most of their ~7 minutes is booting a
  # simulator, so they run on main (and on demand) rather than gating every
  # PR. One `xcodebuild test` runs both, so the simulator boots once.
  app-tests:
    name: App tests
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SIMULATOR: iPhone 16

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Unit and UI tests
        run: |
          xcodebuild test \
            -project App/Rulebook.xcodeproj \
            -scheme Rulebook \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR }}" \
            CODE_SIGNING_ALLOWED=NO
