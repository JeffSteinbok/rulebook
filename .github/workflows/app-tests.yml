name: App tests

# The app's unit and UI tests on a simulator. Most of the ~7 minutes is
# booting it, so this isn't on every PR: Publish TestFlight calls it and
# won't upload unless it passes, and it runs on PRs that change the tests
# themselves. Run it by hand on any branch from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - App/RulebookTests/**
      - App/RulebookUITests/**
      - .github/workflows/app-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Unit and UI tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Select test simulator
        id: simulator
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      # One `xcodebuild test` for both targets, so the simulator boots once.
      - name: Unit and UI tests
        run: |
          xcodebuild test \
            -project App/Rulebook.xcodeproj \
            -scheme Rulebook \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO
