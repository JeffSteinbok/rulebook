name: Rulebook
options:
  bundleIdPrefix: net.steinbok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The library lives at the repository root so it stays consumable over SPM;
  # the app takes it as a local package, so edits show up with no versioning.
  RulebookKit:
    path: ..
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    # Pinned, not ranged: MSAL ships as a binary target, and 2.16.1 was tagged
    # without its MSAL.zip — a range resolved to it and every build 404'd.
    exactVersion: 2.16.0

targets:
  Rulebook:
    type: application
    platform: iOS
    sources:
      - path: Rulebook
    dependencies:
      - package: RulebookKit
        product: RulebookKit
      - package: MSAL
        product: MSAL
    info:
      path: Rulebook/Info.plist
      properties:
        CFBundleDisplayName: Rulebook
        CFBundleShortVersionString: "1.0"
        # Resolved at build time from CURRENT_PROJECT_VERSION. A literal here
        # silently overrides whatever the build passes, which shipped build 1
        # and would have had every later upload rejected: App Store Connect
        # requires the build number to strictly increase.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declared here so App Store Connect has it at upload time. Without it,
        # every TestFlight build stops to ask about export compliance; setting
        # it afterwards through the API returns 409 because the value is
        # already present. Rulebook uses only standard HTTPS, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Public-client id from Scripts/register-app.sh. Not a secret — a
        # public client has none, and this ships inside every app binary.
        RulebookClientID: 72997602-da76-49bd-a1cd-90f67d51bcc6
        # MSAL hands control back through this scheme; it must match the
        # redirect URI on the registration exactly.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - msauth.net.steinbok.Rulebook
        # Lets MSAL detect and broker through Authenticator when installed.
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steinbok.Rulebook
        # Needed for $(AppIdentifierPrefix) in the entitlements to resolve;
        # without a team it expands to nothing and the keychain group is
        # silently dropped from the signed binary.
        DEVELOPMENT_TEAM: Y7KVX7666P
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
